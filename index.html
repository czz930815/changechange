    const firebaseConfig = { apiKey: "AIzaSyBAizT0ijN3-uxegV4w2HX6VFvXvYndc3c", authDomain: "change-389a0.firebaseapp.com", projectId: "change-389a0", storageBucket: "change-389a0.firebasestorage.app", messagingSenderId: "360528719647", appId: "1:360528719647:web:474055ac8fb26e370c0a2a" };

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, Fragment } = React;

    const Icon = ({ name, size = 20, className = "" }) => {
      const icons = {
        Camera: (<Fragment><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></Fragment>),
        Gift: (<Fragment><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></Fragment>),
        Bell: (<Fragment><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></Fragment>),
        Lock: (<Fragment><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Fragment>),
        Ticket: (<Fragment><path d="M2 9V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2-2v4a2 2 0 0 0 0 4v4a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-4a2 2 0 0 0 0-4Z"/><path d="M13 3v18M9 3v18M15 3v18"/></Fragment>),
        Trash2: (<Fragment><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Fragment>),
        Plus: (<Fragment><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Fragment>),
        Image: (<Fragment><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></Fragment>),
        Disc: (<Fragment><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><path d="M12 2a10 10 0 0 0 0 20"/><path d="M12 12 2.3 10.5"/><path d="M12 12l9.7-1.5"/></Fragment>),
        PiggyBank: (<Fragment><path d="M19 5c-1.5 0-2.8 0.6-3.8 1.5l-2.5 2.5c-3 3-5 3-5 3s-0.5-2.3 3-5l2.5-2.5c1-1 2.5-1.5 4-1.5 2.5 0 4.8 1.5 5.8 3.5H19z"/><path d="M19 5h-1"/><path d="M22 9c0 5-4 9-9 9s-9-4-9-9c0-3.3 2-6.2 4.9-7.9l0.9 0.9C7.5 3.1 6 5.4 6 8c0 3.3 2.7 6 6 6s6-2.7 6-6c0-2-0.8-3.8-2.2-5l0.7-0.7c3.1 1.7 5.5 5 5.5 6.7z"/></Fragment>),
        ArrowLeft: (<Fragment><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></Fragment>),
        LogOut: (<Fragment><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></Fragment>),
        Refresh: (<Fragment><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></Fragment>),
        Check: <polyline points="20 6 9 17 4 12"/>,
        Chart: (<Fragment><path d="M12 20V10M18 20V4M6 20v-4"/></Fragment>),
        Sparkles: (<Fragment><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1-1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></Fragment>),
        Coins: (<Fragment><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18.06"/><path d="M7 6h2v4"/><path d="M17 12h2v4"/></Fragment>),

      return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={1.5} strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name] || null}</svg>;
    };

    const ScratchCell = ({ value, canScratch, onRevealed, isRevealed }) => {
      const canvasRef = useRef(null);
      const hasTriggeredRef = useRef(false);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (isRevealed) { ctx.clearRect(0, 0, canvas.width, canvas.height); } 
        else {
          hasTriggeredRef.current = false; ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#94a3b8'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#e2e8f0'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', canvas.width/2, canvas.height/2);
        }
      }, [isRevealed]);

      const scratch = (clientX, clientY) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const ctx = canvas.getContext('2d');
        ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.arc(clientX - rect.left, clientY - rect.top, 12, 0, Math.PI * 2); ctx.fill();
        if (!hasTriggeredRef.current) { hasTriggeredRef.current = true; onRevealed(value); }
      };

      return (
        <div className="scratch-grid-cell relative">
          <div className="scratch-content">{value}</div>
          <canvas ref={canvasRef} width={80} height={80} className={`scratch-canvas absolute top-0 left-0 w-full h-full z-10 ${isRevealed ? 'invisible' : 'visible'}`} 
            style={{ touchAction: 'none' }}
            onMouseMove={(e) => !isRevealed && canScratch && e.buttons === 1 && scratch(e.clientX, e.clientY)}
            onTouchMove={(e) => !isRevealed && canScratch && scratch(e.touches[0].clientX, e.touches[0].clientY)}
            onMouseDown={(e) => !isRevealed && canScratch && scratch(e.clientX, e.clientY)}
            onTouchStart={(e) => !isRevealed && canScratch && scratch(e.touches[0].clientX, e.touches[0].clientY)}
          />
        </div>
      );
    };

    const compressImage = (file) => {
      return new Promise((resolve) => {
        const reader = new FileReader(); reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image(); img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas'); const scale = 400 / img.width;
            canvas.width = 400; canvas.height = img.height * scale;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
        };
      });
    };

    function App() {
      const { db, auth, doc, setDoc, updateDoc, collection, onSnapshot, addDoc, increment, serverTimestamp, deleteDoc, arrayUnion, getDoc, appId, onAuthStateChanged } = window.fb;
      const [user, setUser] = useState(null);
      const [activeTab, setActiveTab] = useState('home');
      const [currentActivity, setCurrentActivity] = useState(null); 
      const [isAdmin, setIsAdmin] = useState(false);
      const [points, setPoints] = useState(0);
      const [stats, setStats] = useState({ totalIssued: 0, totalRedeemed: 0 });
      const [submissions, setSubmissions] = useState([]);
      const [rewards, setRewards] = useState([]);
      const [notifications, setNotifications] = useState([]);
      const [loading, setLoading] = useState(true);
      const [announcement, setAnnouncement] = useState('歡迎光臨 Point 應有盡有大超商');

      const [gameSettings, setGameSettings] = useState({ wheelCost: 20, wheelSegments: [], bankRate: 0.05, bankLockHours: 24, checkInPoints: 2 });
      const [savings, setSavings] = useState({ balance: 0, lastInterestTime: null });
      const [wheelSpinning, setWheelSpinning] = useState(false);
      const [wheelRotation, setWheelRotation] = useState(0);
      const [pendingSettings, setPendingSettings] = useState(null);
      
      const [desc, setDesc] = useState('');
      const [selectedFile, setSelectedFile] = useState(null);
      const [isUploading, setIsUploading] = useState(false);
      const [adminPass, setAdminPass] = useState('');
      const [showAdminLogin, setShowAdminLogin] = useState(false);

      // Admin & Logic States
      const [approvalPoints, setApprovalPoints] = useState({});
      const [wishName, setWishName] = useState('');
      const [wishImage, setWishImage] = useState(null);
      const [isWishing, setIsWishing] = useState(false);
      const [wishCosts, setWishCosts] = useState({});
      const [givePointsReason, setGivePointsReason] = useState('');
      const [givePointsAmount, setGivePointsAmount] = useState('');
      const [adminRewardName, setAdminRewardName] = useState('');
      const [adminRewardCost, setAdminRewardCost] = useState('');
      const [adminRewardImage, setAdminRewardImage] = useState(null);
      const [isAddingReward, setIsAddingReward] = useState(false);

      // Scratch Game Admin States
      const [scratchActivities, setScratchActivities] = useState([]);
      const [selectedScratchGame, setSelectedScratchGame] = useState(null);
      const [currentGameProgress, setCurrentGameProgress] = useState([]);
      const [adminScratchTitle, setAdminScratchTitle] = useState('');
      const [adminScratchCost, setAdminScratchCost] = useState('');
      const [adminScratchPrize, setAdminScratchPrize] = useState('');
      const [adminScratchTarget, setAdminScratchTarget] = useState('');
      const [adminScratchWinnerIndex, setAdminScratchWinnerIndex] = useState(null);
      const [adminScratchImage, setAdminScratchImage] = useState(null);
      const [editingScratchId, setEditingScratchId] = useState(null);

      const getPublicRef = (name) => collection(db, 'artifacts', appId, 'public', 'data', name);

      useEffect(() => {
        if (!user) return;
        const unsubStats = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'total'), (d) => { if (d.exists()) { setPoints(d.data().totalPoints || 0); setStats({ totalIssued: d.data().totalIssued || 0, totalRedeemed: d.data().totalRedeemed || 0 }); } });
        const unsubSub = onSnapshot(getPublicRef('submissions'), (s) => setSubmissions(s.docs.map(d => ({id: d.id, ...d.data()}))));
        const unsubReward = onSnapshot(getPublicRef('rewards'), (s) => setRewards(s.docs.map(d => ({id: d.id, ...d.data()}))));
        const unsubSetting = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'games'), (d) => { if(d.exists()) { setGameSettings(d.data()); setPendingSettings(prev => prev ? prev : d.data()); } });
        const unsubSaving = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'savings', 'account'), (d) => { if(d.exists()) setSavings(d.data()); });
        const unsubScratch = onSnapshot(getPublicRef('scratch_activities'), (s) => setScratchActivities(s.docs.map(d => ({id: d.id, ...d.data()}))));
        const unsubAnnounce = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'announce'), (d) => { if (d.exists()) setAnnouncement(d.data().text); });
        const unsubNotif = onSnapshot(getPublicRef('notifications'), (s) => setNotifications(s.docs.map(d => ({id: d.id, ...d.data()}))));
        return () => { unsubStats(); unsubSub(); unsubReward(); unsubSetting(); unsubSaving(); unsubScratch(); unsubAnnounce(); unsubNotif(); };
      }, [user]);

      useEffect(() => {
         if (!user || !selectedScratchGame) return;
         return onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'scratch_progress', `${selectedScratchGame.id}_global`), (d) => {
            if (d.exists()) setCurrentGameProgress(d.data().revealedIndices || []);
         });
      }, [selectedScratchGame, user]);

      useEffect(() => {
        return onAuthStateChanged(auth, (u) => { 
          if (u) { 
            setUser(u); setLoading(false); 
            const ls = document.getElementById('loading-screen');
            if(ls) { ls.style.opacity = '0'; setTimeout(() => ls.style.display = 'none', 500); }
            document.getElementById('root').classList.add('loaded');
          } 
        });
      }, []);

      const handleSpinWheel = async () => {
        const cost = gameSettings.wheelCost || 20;
        if(points < cost || wheelSpinning) return;
        setWheelSpinning(true);
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'total'), { totalPoints: increment(-cost), totalRedeemed: increment(cost) });
        
        const segments = gameSettings.wheelSegments;
        const totalWeight = segments.reduce((sum, s) => sum + (s.weight || 0), 0);
        let random = Math.random() * totalWeight;
        let winnerIndex = 0;
        for(let i=0; i<segments.length; i++) {
            random -= (segments[i].weight || 0);
            if(random <= 0) { winnerIndex = i; break; }
        }

        const segmentAngle = 360 / segments.length;
        const targetAngle = (winnerIndex * segmentAngle) + (segmentAngle / 2);
        const finalRot = wheelRotation + 1800 + (360 - (targetAngle % 360));
        setWheelRotation(finalRot);

        setTimeout(async () => {
           setWheelSpinning(false);
           const win = segments[winnerIndex];
           alert(`結果：${win.label}`);
           if(win.value > 0) {
              await addDoc(getPublicRef('submissions'), { description: `🎡 轉盤獎勵：${win.label}`, status: 'bonus', awardedPoints: win.value, timestamp: serverTimestamp(), userId: user.uid });
              await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'total'), { totalPoints: increment(win.value), totalIssued: increment(win.value) });
           }
        }, 3000);
      };

      const handleRevealed = async (val, game, idx) => {
        if (points < game.cost) return alert("點數不足");
        const progRef = doc(db, 'artifacts', appId, 'public', 'data', 'scratch_progress', `${game.id}_global`);
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'total'), { totalPoints: increment(-game.cost), totalRedeemed: increment(game.cost) });
        await setDoc(progRef, { gameId: game.id, revealedIndices: arrayUnion(idx), timestamp: serverTimestamp() }, { merge: true });
        if (parseInt(val) === parseInt(game.target)) {
            const prize = parseInt(game.prize);
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'total'), { totalPoints: increment(prize), totalIssued: increment(prize) });
            alert("恭喜中獎！");
        }
      };

      const handleRedeem = async (r) => {
        if(points < r.cost) return alert("點數不足");
        if(confirm(`兌換 ${r.name}?`)) {
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'total'), { totalPoints: increment(-r.cost), totalRedeemed: increment(r.cost) });
          await addDoc(getPublicRef('submissions'), { description: `🎁 已兌換：${r.name}`, image: r.image, status: 'redeemed', awardedPoints: -r.cost, timestamp: serverTimestamp(), userId: user.uid });
          alert("兌換成功，請至票券夾查看");
        }
      };

      const handleCollectInterest = async () => {
        const lastTime = savings.lastInterestTime ? savings.lastInterestTime.seconds * 1000 : 0;
        if(Date.now() - lastTime < 86400000) return alert("每日只能領取一次利息");
        const interest = Math.floor((savings.balance || 0) * (gameSettings.bankRate || 0.05));
        if(interest <= 0) return alert("本金過低無利息");
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'savings', 'account'), { balance: increment(interest), lastInterestTime: serverTimestamp() }, { merge: true });
        await addDoc(getPublicRef('submissions'), { description: "💰 金庫利息", status: 'bonus', awardedPoints: interest, timestamp: serverTimestamp(), userId: user.uid });
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'total'), { totalPoints: increment(interest), totalIssued: increment(interest) });
        alert(`領取利息：${interest} 點`);
      };

      // Admin & Wish Logic
      const handleMakeWish = async () => { 
          if(wishName) { 
              setIsWishing(true); 
              try {

            {activeTab === 'admin' && isAdmin && (
               <div className="space-y-8 animate-in pb-12">
                  <div className="luxury-bg p-6 rounded-[30px] text-white shadow-lg relative overflow-hidden">
                    <h2 className="text-sm font-bold flex gap-2 items-center mb-6"><Icon name="Chart" size={18}/> 營運儀表板</h2>
                    <div className="grid grid-cols-2 gap-4">
                      <div className="bg-white/10 p-4 rounded-2xl border border-white/10"><p className="text-[9px] font-bold text-slate-300 uppercase tracking-widest mb-1">已發放</p><p className="text-2xl font-bold">{stats.totalIssued}</p></div>
                      <div className="bg-white/10 p-4 rounded-2xl border border-white/10"><p className="text-[9px] font-bold text-slate-300 uppercase tracking-widest mb-1">已回收</p><p className="text-2xl font-bold">{stats.totalRedeemed}</p></div>
                    </div>
                    <button onClick={updateAnnounce} className="w-full mt-4 bg-white/10 py-3 rounded-xl text-[10px] font-bold hover:bg-white/20 transition-colors">修改公告</button>
                  </div>
                  
                  <div className="luxury-card p-7 rounded-[35px] space-y-4">
                      <h3 className="font-bold flex items-center gap-3 text-deep-blue text-xs tracking-widest uppercase">系統點數管理</h3>
                      <div className="flex gap-3">
                        <input className="settings-input flex-[2]" placeholder="原因 (例: 額外獎勵)" value={givePointsReason} onChange={e => setGivePointsReason(e.target.value)} />
                        <input type="number" className="settings-input flex-1" placeholder="點數" value={givePointsAmount} onChange={e => setGivePointsAmount(e.target.value)} />
                      </div>
                      <div className="flex gap-3">
                          <button onClick={() => handleManagePoints(false)} className="flex-1 btn-gold py-3 rounded-xl font-bold text-xs uppercase tracking-widest shadow-md">發送 (+)</button>
                          <button onClick={() => handleManagePoints(true)} className="flex-1 bg-slate-200 text-slate-600 hover:bg-slate-300 transition-colors py-3 rounded-xl font-bold text-xs uppercase tracking-widest shadow-md">扣除 (-)</button>
                      </div>
                  </div>

                  <div className="luxury-card p-7 rounded-[35px] space-y-6">
                      <h3 className="font-bold flex items-center gap-3 text-deep-blue text-xs tracking-widest uppercase">待處理審核</h3>
                      <div className="space-y-5">
                        {submissions.filter(s => s.status==='pending').map(sub => (
                           <div key={sub.id} className="bg-slate-50 p-5 rounded-2xl space-y-4 border border-slate-100 shadow-sm">
                              {sub.image && <img src={sub.image} className="w-full h-44 object-cover rounded-xl" />}
                              <p className="text-xs font-medium italic">"{sub.description}"</p>
                              <div className="flex gap-3">
                                 <input type="number" className="settings-input flex-1 font-bold" placeholder="10" value={approvalPoints[sub.id] || ''} onChange={e => setApprovalPoints({...approvalPoints, [sub.id]: e.target.value})} />
                                 <button onClick={() => handleApprove(sub, approvalPoints[sub.id] || 10)} className="btn-primary px-8 text-xs font-bold uppercase">批准</button>
                                 <button onClick={() => handleReject(sub)} className="bg-slate-200 px-4 rounded-xl text-xs font-bold text-slate-500">拒絕</button>
                              </div>
                           </div>
                        ))}
                      </div>
                  </div>
                  
                  <div className="luxury-card p-7 rounded-[35px] space-y-6">
                      <h3 className="font-bold flex items-center gap-3 text-deep-blue text-xs tracking-widest uppercase">許願池審核</h3>
                      <div className="space-y-4">
                        {rewards.filter(r => !r.available).length === 0 ? <p className="text-center text-xs text-slate-300">目前沒有許願</p> : 
                            rewards.filter(r => !r.available).map(wish => (
                                <div key={wish.id} className="bg-slate-50 p-4 rounded-2xl flex gap-4 items-center border border-slate-100 shadow-sm">
                                    <div className="w-16 h-16 rounded-xl bg-white overflow-hidden shrink-0"><img src={wish.image} className="w-full h-full object-cover" /></div>
                                    <div className="flex-1 min-w-0">
                                        <p className="text-xs font-bold text-deep-blue truncate">{wish.name}</p>
                                        <p className="text-[9px] text-slate-400">{wish.timestamp ? new Date(wish.timestamp.seconds * 1000).toLocaleDateString() : ''}</p>
                                    </div>
                                    <div className="flex flex-col gap-2 items-end">
                                        <input type="number" className="settings-input w-24 text-center py-1" placeholder="設定點數" value={wishCosts[wish.id] || ''} onChange={e => setWishCosts({...wishCosts, [wish.id]: e.target.value})} />
                                        <div className="flex gap-1">
                                            <button onClick={() => handleApproveWish(wish, wishCosts[wish.id])} className="btn-primary px-3 py-1.5 text-[10px] font-bold">上架</button>
                                            <button onClick={() => deleteItem('rewards', wish.id, wish.name)} className="bg-slate-200 px-3 py-1.5 rounded-lg text-[10px] font-bold text-slate-500">刪除</button>
                                        </div>
                                    </div>
                                </div>
                            ))
                        }
                      </div>
                  </div>

                  <div className="luxury-card p-7 rounded-[35px] space-y-6 admin-scratch-form">
                      <h3 className="font-bold flex items-center gap-3 text-deep-blue text-xs tracking-widest uppercase">格子樂活動管理</h3>
                      <div className="space-y-4">
                        <input className="settings-input" placeholder="活動標題" value={adminScratchTitle} onChange={e => setAdminScratchTitle(e.target.value)} />
                        <div className="grid grid-cols-2 gap-2">
                           <input className="settings-input" placeholder="大獎" value={adminScratchPrize} onChange={e => setAdminScratchPrize(e.target.value)} />
                           <input type="number" className="settings-input" placeholder="花費" value={adminScratchCost} onChange={e => setAdminScratchCost(e.target.value)} />
                        </div>
                        {!editingScratchId && (
                           <div className="grid grid-cols-2 gap-2">
                              <input type="number" className="settings-input" placeholder="中獎號(1-16)" value={adminScratchTarget} onChange={e => setAdminScratchTarget(e.target.value)} />
                              <input type="number" className="settings-input" placeholder="中獎位置(0-15)" value={adminScratchWinnerIndex} onChange={e => setAdminScratchWinnerIndex(e.target.value)} />
                           </div>
                        )}
                        <input type="file" className="text-xs" onChange={e => setAdminScratchImage(e.target.files[0])} />
                        <div className="flex gap-2">
                           {editingScratchId && <button onClick={() => setEditingScratchId(null)} className="flex-1 bg-slate-100 py-3 rounded-xl text-xs font-bold text-slate-500">取消</button>}
                           <button onClick={handleAddScratchActivity} disabled={isAddingReward} className="flex-[2] btn-primary py-3 rounded-xl text-xs font-bold uppercase">{editingScratchId ? '更新' : '發布'}</button>
                        </div>
                        <div className="mt-4 pt-4 border-t border-slate-100 space-y-2">
                           {scratchActivities.map(g => (
                              <div key={g.id} className="flex items-center justify-between bg-slate-50 p-2 rounded-lg">
                                 <span className="text-xs font-bold text-slate-600">{g.title}</span>
                                 <div className="flex gap-2">
                                    <button onClick={() => { setEditingScratchId(g.id); setAdminScratchTitle(g.title); setAdminScratchPrize(g.prize); setAdminScratchCost(g.cost); document.querySelector('.admin-scratch-form').scrollIntoView({behavior:'smooth'}); }} className="text-blue-500 font-bold text-[10px]">編輯</button>
                                    <button onClick={() => deleteItem('scratch_activities', g.id, g.title)} className="text-red-400 p-1"><Icon name="Trash2" size={12}/></button>
                                 </div>
                              </div>
                           ))}
                        </div>
                      </div>
                  </div>

                  <div className="luxury-card p-6 rounded-[30px] space-y-6">
                      <h3 className="font-bold flex items-center gap-3 text-deep-blue text-xs tracking-widest uppercase">商品上架</h3>
                      <div className="space-y-4">
                        <input className="settings-input" placeholder="名稱" value={adminRewardName} onChange={e => setAdminRewardName(e.target.value)} />
                        <input type="number" className="settings-input" placeholder="點數" value={adminRewardCost} onChange={e => setAdminRewardCost(e.target.value)} />
                        <input type="file" accept="image/*" className="text-[10px] block w-full text-slate-400" onChange={e => setAdminRewardImage(e.target.files[0])} />
                        <button onClick={handleUploadTaskByAdmin} disabled={isAddingReward} className="w-full py-4 bg-sky-500 text-white rounded-xl font-bold text-xs uppercase shadow-md">確認上架商品</button>
                      </div>
                  </div>
                  
                  <div className="luxury-card p-7 rounded-[35px] space-y-6">
                      <h3 className="font-bold flex items-center gap-3 text-deep-blue text-xs tracking-widest uppercase">遊戲參數設定</h3>
                      <div className="grid grid-cols-2 gap-4">
                        <div><label className="settings-label">轉盤費用</label><input type="number" className="settings-input" value={pendingSettings?.wheelCost} onChange={e => setPendingSettings({...pendingSettings, wheelCost: parseInt(e.target.value)})} /></div>
                        <div><label className="settings-label">金庫日利率</label><input type="number" step="0.01" className="settings-input" value={pendingSettings?.bankRate} onChange={e => setPendingSettings({...pendingSettings, bankRate: parseFloat(e.target.value)})} /></div>
                      </div>
                      <button onClick={handleSaveGameSettings} className="w-full py-4 btn-primary rounded-xl font-bold text-xs uppercase tracking-widest shadow-xl">儲存全系統設定</button>
                  </div>
               </div>
            )}
          </div>

          <div className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-xl border-t border-slate-100 px-6 py-5 flex justify-between items-center text-[9px] font-bold text-slate-300 max-w-md mx-auto z-50 sm:rounded-b-[40px] shadow-lg">
            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1.5 transition-all ${activeTab === 'home' ? 'text-slate-800 scale-110' : ''}`}><Icon name="Camera" size={22}/><span>首頁</span></button>
            <button onClick={() => {setActiveTab('activities'); setCurrentActivity(null);}} className={`flex flex-col items-center gap-1.5 transition-all ${activeTab === 'activities' ? 'text-slate-800 scale-110' : ''}`}><Icon name="Sparkles" size={22}/><span>活動</span></button>
            <button onClick={() => setActiveTab('tickets')} className={`flex flex-col items-center gap-1.5 transition-all ${activeTab === 'tickets' ? 'text-slate-800 scale-110' : ''}`}><Icon name="Ticket" size={22}/><span>票券夾</span></button>
            <button onClick={() => setActiveTab('rewards')} className={`flex flex-col items-center gap-1.5 transition-all ${activeTab === 'rewards' ? 'text-slate-800 scale-110' : ''}`}><Icon name="Gift" size={22}/><span>商店</span></button>
            {isAdmin && <button onClick={() => setActiveTab('admin')} className={`flex flex-col items-center gap-1.5 transition-all ${activeTab === 'admin' ? 'text-slate-800 scale-110' : ''}`}><Icon name="Lock" size={22}/><span>後台</span></button>}
            {!isAdmin && <button onClick={() => window.location.reload()} className="flex flex-col items-center gap-1.5 text-rose-300"><Icon name="Refresh" size={22}/><span>重整</span></button>}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
